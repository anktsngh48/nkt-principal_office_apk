name: Build Android app

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      app_url:
        description: 'Address of the Principal''s Office page the app opens (leave empty to use the APP_URL repository variable)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Work out the page address
        run: |
          url="${{ github.event.inputs.app_url }}"
          [ -z "$url" ] && url="${{ vars.APP_URL }}"
          if [ -z "$url" ]; then
            echo "::error::No page address. Add a repository variable named APP_URL (Settings > Secrets and variables > Actions > Variables), e.g. https://<user>.github.io/principals-office/ , or run the workflow by hand and fill in app_url."
            exit 1
          fi
          echo "APP_URL=$url" >> "$GITHUB_ENV"
          echo "The app will open: $url"

      - name: Use the release key (only if you added it as secrets)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> "$GITHUB_ENV"
          else
            echo "No release key set, signing with the bundled key."
          fi

      - name: Build APK
        run: |
          # Find the app folder even if the files were uploaded inside a sub-folder.
          settings="$(find . -name settings.gradle -not -path './.git/*' | head -n1)"
          if [ -z "$settings" ]; then
            echo "::error::settings.gradle was not found. The app files (app folder, build.gradle, settings.gradle) are missing from this repo."
            exit 1
          fi
          dir="$(dirname "$settings")"
          echo "Building in $dir"
          cd "$dir"
          gradle --no-daemon assembleRelease -PappUrl="$APP_URL"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/PrincipalsOffice.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: PrincipalsOffice-apk
          path: PrincipalsOffice.apk
          if-no-files-found: error

      - name: Publish to the "latest" release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Principal's Office app
          body: |
            Download **PrincipalsOffice.apk** below and open it on an Android phone.
            Build ${{ github.run_number }} from commit ${{ github.sha }}.
          files: PrincipalsOffice.apk
          make_latest: true
