plugins {
    id 'com.android.application'
}

def buildNo = (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()

// Optional release key (GitHub secrets). Without it the APK is signed with the bundled debug.keystore,
// which is still stable, so new builds install over old ones.
def releaseKeystore = System.getenv('KEYSTORE_FILE')
def hasReleaseKey = releaseKeystore && file(releaseKeystore).exists()

android {
    namespace 'com.deeksha.principalsoffice'
    compileSdk 34

    defaultConfig {
        applicationId 'com.deeksha.principalsoffice'
        minSdk 24
        targetSdk 34
        versionCode buildNo
        versionName "1.0.${buildNo}"
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        if (hasReleaseKey) {
            release {
                storeFile file(releaseKeystore)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig hasReleaseKey ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.core:core-splashscreen:1.0.1'
}
